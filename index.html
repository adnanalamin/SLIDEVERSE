<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SLIDEVERSE — The open-source slider collection.">
  <meta name="theme-color" content="#0b1020">
  <title>SLIDEVERSE — Create. Animate. Slide.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f5f7ff; background:
      radial-gradient(circle at 15% 15%, #263b72 0, transparent 35%),
      radial-gradient(circle at 85% 80%, #542b75 0, transparent 32%), #0b1020;
      font: 16px/1.6 system-ui, sans-serif;
    }
    main { width: min(760px, 100%); text-align: center; }
    .eyebrow { color: #a9b9ff; letter-spacing: .2em; font-size: .78rem; font-weight: 700; }
    h1 { margin: 12px 0; font-size: clamp(3rem, 12vw, 6.5rem); line-height: 1; letter-spacing: -.07em; }
    h1 span { background: linear-gradient(100deg, #8ee7ff, #c3a5ff, #ff9bc8); color: transparent; background-clip: text; }
    p { color: #b9c2d9; }
    a { display: inline-block; margin-top: 18px; padding: 12px 20px; border-radius: 999px;
        color: #101426; background: #c3eaff; text-decoration: none; font-weight: 700; }
    .note { margin-top: 36px; font-size: .85rem; color: #8e9ab5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">OPEN SOURCE · COMMUNITY POWERED</div>
    <h1><span>SLIDEVERSE</span></h1>
    <p>The Ultimate Open-Source Slider Collection</p>
    <p>Create. Animate. Slide.</p>
    <a href="https://github.com/adnanalamin/SLIDEVERSE">View on GitHub</a>
    <div class="note">The collection is under development. Components will be published as they are completed and tested.</div>
  </main>
</body>
</html>
