<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Showcase Slider · SLIDEVERSE 02</title>
  <meta name="description" content="A premium, accessible product carousel built with vanilla HTML, CSS and JavaScript. SLIDEVERSE project 02.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563EB'/%3E%3Crect x='7' y='11' width='18' height='10' rx='3' fill='%23fff'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <header class="topbar">
    <div class="container topbar__inner">
      <p class="brand">
        <span class="brand__name">Slideverse</span>
        <span class="brand__sub">Product Showcase Slider</span>
      </p>
      <button type="button" class="cart-btn" id="cart-btn" data-action="open-cart" aria-label="Open cart, 0 items">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-btn__label">Cart</span>
        <span class="cart-btn__count" id="cart-count" hidden>0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="showcase" id="showcase" aria-labelledby="showcase-title" aria-roledescription="carousel">
      <div class="container">

        <header class="section-head">
          <div class="section-head__text">
            <p class="eyebrow">FEATURED COLLECTION</p>
            <h2 id="showcase-title">Discover Our Products</h2>
            <p class="section-head__desc">Explore our handpicked collection of premium products.</p>
          </div>

          <div class="section-head__controls">
            <button type="button" class="view-all" id="view-all" data-action="toggle-view-all" aria-expanded="false" aria-controls="slider-track">
              <span id="view-all-label">View all</span>
              <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polyline points="9 18 15 12 9 6"/></svg>
            </button>

            <div class="nav" role="group" aria-label="Slider controls">
              <button type="button" class="nav-btn" id="prev-btn" data-action="prev" aria-label="Previous products" aria-controls="slider-track">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <button type="button" class="nav-btn" id="next-btn" data-action="next" aria-label="Next products" aria-controls="slider-track">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
              <button type="button" class="nav-btn" id="autoplay-btn" data-action="toggle-autoplay" aria-label="Pause autoplay" hidden>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></svg>
              </button>
            </div>
          </div>
        </header>

        <div class="viewport" id="slider-viewport" role="group" aria-label="Featured products. Use the left and right arrow keys to browse." tabindex="0">
          <ul class="track" id="slider-track">
            <!-- Product cards are rendered by js/script.js -->
          </ul>
        </div>
        <noscript><p class="noscript">Please enable JavaScript to browse the product collection.</p></noscript>

        <p class="sr-only" id="slider-status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>SLIDEVERSE &middot; Project 02 &middot; Basic &amp; Minimal Sliders</p>
    </div>
  </footer>

  <!-- Toasts live in the top layer when a dialog is open (moved by script.js) -->
  <div class="toasts" id="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- Cart -->
  <dialog class="dialog dialog--cart" id="cart-dialog" aria-labelledby="cart-title">
    <div class="dialog__panel">
      <header class="dialog__head">
        <h2 id="cart-title">Your cart</h2>
        <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Close cart">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <div class="dialog__body" id="cart-body"></div>
      <footer class="dialog__foot" id="cart-foot"></footer>
    </div>
  </dialog>

  <!-- Product quick view -->
  <dialog class="dialog dialog--product" id="quick-view" aria-labelledby="qv-title">
    <div class="dialog__panel" id="qv-panel"></div>
  </dialog>

</body>
</html>
